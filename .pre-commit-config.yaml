repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: ruff-format-check
        name: ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-check
        name: ruff lint
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        types: [python]
      - id: isort-check
        name: isort check
        entry: uv run isort --check-only torchmoe tests main.py
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy-check
        name: mypy type check
        entry: uv run mypy torchmoe
        language: system
        pass_filenames: false
        types: [python]
